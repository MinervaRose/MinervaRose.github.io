*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1050px;margin:auto;padding:clamp(28px,5vw,65px) 25px 50px}
.header{position:relative;max-width:680px;margin:0 auto;text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:.23em;font-weight:750;font-size:11px;color:var(--rose)}
h1{font-size:clamp(31px,5vw,55px);line-height:1.06;font-weight:650;letter-spacing:-.048em;margin:14px 0 14px}
.gradient-word{background:linear-gradient(105deg,var(--rose),var(--orange) 56%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:15px;line-height:1.8;color:#6d6274;margin:0 auto;max-width:590px}
.stage{
  display:block;position:relative;margin:20px auto 0;width:min(100%,690px);height:560px;
  cursor:pointer;outline-offset:5px;border:0;border-radius:24px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.stage:focus-visible{outline:2px solid var(--violet)}
.stage::before{
 content:""; position:absolute;width:440px;height:420px;top:52px;left:50%;transform:translateX(-50%);
 background:radial-gradient(ellipse closest-side,rgba(216,27,96,.085),rgba(123,47,247,.04) 45%,transparent 74%);
 pointer-events:none; opacity:.8;transition:opacity .7s ease,transform 1.2s ease;
}
.stage.open::before{opacity:.35;transform:translateX(-50%) scale(1.24)}
.halo{position:absolute;left:50%;top:45%;width:310px;height:310px;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(216,27,96,.08),rgba(255,138,0,.09),rgba(123,47,247,.10),rgba(216,27,96,.08));filter:blur(48px);opacity:.42;pointer-events:none;transition:transform 1s ease,opacity 1s ease}
.stage:hover:not(.open) .halo,.stage:focus-visible:not(.open) .halo{transform:translate(-50%,-50%) scale(1.16);opacity:.7}
.artifact{
  position:absolute;top:50%;left:50%;width:344px;height:412px;perspective:900px;transform:translate(-50%,-51%);
  pointer-events:none;filter:drop-shadow(0 16px 18px rgba(123,47,247,.07));
}
.artifactFloat{position:relative;width:100%;height:100%;animation:float 8.5s ease-in-out infinite;transform-origin:50% 50%;will-change:transform}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.2deg)}}
.stage:hover:not(.open) .artifactFloat,.stage:focus-visible:not(.open) .artifactFloat{animation-duration:5s}
.stage.open .artifactFloat{animation:none;transform:translateY(-3px) rotate(0)}
.artWhole,.shard{position:absolute;inset:0;background-image:var(--art);background-size:100% 100%;background-position:center;background-repeat:no-repeat}
.artWhole{opacity:1;z-index:6;transition:opacity 280ms ease 0ms,filter .5s ease;}
.stage:hover:not(.open) .artWhole{filter:brightness(1.075) saturate(1.09)}
.stage.open .artWhole{opacity:0;transition:opacity 240ms ease 60ms}
.shard{will-change:transform;z-index:5;transform-origin:center center;transition:transform 1550ms cubic-bezier(.19,.83,.21,1),filter 1200ms ease,opacity 850ms ease}
.shard.top{clip-path:polygon(50% 50%,0 0,100% 0);z-index:5}
.shard.right{clip-path:polygon(50% 50%,100% 0,100% 100%);z-index:5}
.shard.bottom{clip-path:polygon(50% 50%,100% 100%,0 100%);z-index:5}
.shard.left{clip-path:polygon(50% 50%,0 100%,0 0);z-index:5}
.stage.open .shard.top{transform:translate(0,-81px) rotate(-11deg) rotateX(18deg) scale(.83);filter:brightness(1.1)}
.stage.open .shard.right{transform:translate(128px,0) rotate(13deg) rotateY(-18deg) scale(.82);filter:brightness(1.07)}
.stage.open .shard.bottom{transform:translate(0,78px) rotate(10deg) rotateX(-17deg) scale(.83);filter:brightness(1.13)}
.stage.open .shard.left{transform:translate(-128px,0) rotate(-13deg) rotateY(18deg) scale(.82);filter:brightness(1.08)}
.orbit{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.26;transition:opacity 450ms ease,transform 900ms ease;animation:orbitDrift 10s ease-in-out infinite alternate}
@keyframes orbitDrift{0%{transform:rotate(-4deg) scale(1.02)}100%{transform:rotate(3deg) scale(1.035)}}
.stage:hover:not(.open) .orbit,.stage:focus-visible:not(.open) .orbit{opacity:.68}
.stage.open .orbit{opacity:0;animation:none}
.orbit svg{width:100%;height:100%;overflow:visible}
.qrPlate{position:absolute;z-index:7;left:50%;top:49%;width:282px;min-height:315px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:translate(-50%,-50%) scale(.70) rotate(-7deg);opacity:0;pointer-events:none;
  border:1px solid rgba(146,104,135,.15);border-radius:26px;
  background:linear-gradient(155deg,rgba(255,250,252,.98),rgba(255,247,248,.98) 45%,rgba(250,244,254,.98));
  box-shadow:0 18px 54px rgba(100,50,104,.06),0 0 40px rgba(241,144,162,.045);
  transition:opacity 650ms ease,transform 1350ms cubic-bezier(.2,.78,.25,1);}
.stage.open .qrPlate{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);pointer-events:auto;transition:opacity 700ms ease 480ms,transform 1500ms cubic-bezier(.2,.78,.25,1) 100ms}
.qrPlate::before{content:"";position:absolute;inset:8px;border:1px solid rgba(123,47,247,.055);border-radius:20px;pointer-events:none}
.qrImage{width:242px;height:242px;background-image:var(--qr);background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:auto}
.scanText{font-size:10px;text-transform:uppercase;letter-spacing:.22em;font-weight:750;color:#755369;margin:-2px 0 9px}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;background:#fa9b78;filter:blur(.5px);opacity:0;transition:opacity .45s ease}
.spark.a{top:10%;left:28%;background:#d81b60}
.spark.b{top:22%;right:20%;background:#ff8a00}
.spark.c{bottom:26%;right:19%;background:#7b2ff7}
.stage:hover:not(.open) .spark{opacity:.62;animation:sparkle 2.5s ease-in-out infinite alternate}
.stage.open .spark{opacity:0}
@keyframes sparkle{to{transform:scale(1.8);opacity:.24}}
.groundShadow{position:absolute;top:87%;left:50%;width:220px;height:28px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(135,55,127,.14) 0%,rgba(219,85,124,.09) 38%,transparent 75%);filter:blur(10px);transition:opacity 1s ease,width 1s ease;pointer-events:none}
.stage.open .groundShadow{opacity:.4;width:320px}
.stageFoot{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:11px;margin:-18px 0 0;text-align:center}
.prompt{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0;min-height:18px}
.prompt .mobile{display:none}
.revealButton{border:0;border-radius:999px;padding:12px 25px;background:linear-gradient(105deg,#d81b60 0%,#e95278 30%,#ff8a00 68%,#7b2ff7 100%);color:white;font-weight:750;font-size:13px;letter-spacing:.01em;box-shadow:0 9px 24px rgba(216,27,96,.12);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.revealButton:hover{transform:translateY(-2px);box-shadow:0 13px 29px rgba(216,27,96,.2)}
.revealButton:focus-visible{outline:3px solid #7b2ff7;outline-offset:4px}
.links{display:flex;justify-content:center;gap:10px;align-items:center;margin:17px auto 0;color:var(--muted);font-size:12px}
.links a{color:#7b2ff7;text-underline-offset:3px}
.footer{margin:32px auto 0;text-align:center;color:#9b8b9b;font-size:11px;line-height:1.7}
@media (max-width:700px){main{padding:28px 12px 36px}.stage{height:465px;margin-top:4px}.artifact{transform:translate(-50%,-50%) scale(.83)}.stage.open .shard.top{transform:translate(0,-73px) rotate(-11deg) rotateX(18deg) scale(.83)}.stage.open .shard.right{transform:translate(120px,0) rotate(13deg) rotateY(-18deg) scale(.82)}.stage.open .shard.bottom{transform:translate(0,73px) rotate(10deg) rotateX(-17deg) scale(.83)}.stage.open .shard.left{transform:translate(-120px,0) rotate(-13deg) rotateY(18deg) scale(.82)}.qrPlate{width:232px;min-height:262px;border-radius:22px}.qrImage{width:208px;height:208px}.scanText{font-size:9px}.groundShadow{top:89%}.stageFoot{margin:-8px 0 0}.prompt .desktop{display:none}.prompt .mobile{display:inline}.lead{font-size:13px}}
@media (prefers-reduced-motion:reduce){.artifactFloat,.orbit,.spark{animation:none!important}.artWhole,.shard,.qrPlate,.halo,.groundShadow{transition-duration:.01ms!important;transition-delay:0ms!important}}

<ellipse cx="345" cy="277" rx="194" ry="69" stroke="url(#line2)" stroke-width=".7" transform="rotate(32 345 277)"></ellipse>
<defs><lineargradient id="line1"><stop stop-color="#d81b60" stop-opacity=".07"></stop><stop offset=".49" stop-color="#ff8a00" stop-opacity=".6"></stop><stop offset="1" stop-color="#7b2ff7" stop-opacity=".07"></stop></lineargradient><lineargradient id="line2"><stop stop-color="#7b2ff7" stop-opacity=".06"></stop><stop offset=".49" stop-color="#d81b60" stop-opacity=".4"></stop><stop offset="1" stop-color="#ff8a00" stop-opacity=".07"></stop></lineargradient></defs>
</svg>
</div>
<div class="groundShadow"></div>
</div>
<section aria-live="polite" class="stageFoot">
<p class="prompt" id="prompt"><span class="desktop">Hover to awaken · Click to reveal</span><span class="mobile">Tap to reveal</span></p>
<button aria-controls="stage" aria-pressed="false" class="revealButton" id="toggle" type="button">Reveal the connection</button>
</section>


</main>
<script>
(() => {
  'use strict';
  const stage=document.getElementById('stage');
  const toggle=document.getElementById('toggle');
  const prompt=document.getElementById('prompt');
  const qrPlate=document.getElementById('qrPlate');
  let open=false;
  function update(){
    stage.classList.toggle('open',open);
    stage.setAttribute('aria-pressed',String(open));
    stage.setAttribute('aria-label',open?'Close the Celestial Artifact':'Reveal the hidden LinkedIn QR code in the Celestial Artifact');
    toggle.setAttribute('aria-pressed',String(open));
    toggle.textContent=open?'Close the artifact':'Reveal the connection';
    qrPlate.setAttribute('aria-hidden',String(!open));
    prompt.textContent=open?'Scan the QR code to open LinkedIn on your phone. Click again to close.':'';
    if(!open) prompt.innerHTML='<span class="desktop">Hover to awaken · Click to reveal</span><span class="mobile">Tap to reveal</span>';
  }
  function switchState(){open=!open;update();}
  stage.addEventListener('click',switchState);
  stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();switchState();}});
  toggle.addEventListener('click',switchState);
  update();
})();
</script>
</body>
</html>
